<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />

  <title>TRAVORA — Flight, Hotel & Holiday Tour Bookings | India's Leading Travel Portal</title>
  <meta name="description" content="Book cheap domestic and international flights, luxury hotels, and dynamic tour packages across 802 Indian districts. Zero convenience fees with TRAVORA Prime." />

  <meta name="author" content="TRAVORA Technologies" />
  <link rel="icon" type="image/png" href="./static/assets/logo/travora_emblem.png" />

  <!-- GitHub Pages subpath auto-resolution -->
  <script>
    if (window.location.hostname.endsWith('github.io')) {
      const parts = window.location.pathname.split('/').filter(Boolean);
      if (parts.length > 0) {
        window.__TRAVORA_REPO__ = parts[0];
        document.addEventListener('error', function(e) {
          if (e.target && e.target.tagName === 'IMG' && e.target.src) {
            const url = new URL(e.target.src);
            if (url.pathname.startsWith('/static/') && !url.pathname.startsWith('/' + window.__TRAVORA_REPO__ + '/')) {
              e.target.src = '/' + window.__TRAVORA_REPO__ + url.pathname;
            }
          }
        }, true);
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
